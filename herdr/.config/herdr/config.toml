onboarding = false
# herdr configuration
# Keybindings sind aus ~/.config/tmux/tmux.conf portiert — das jeweilige
# tmux-Binding steht als Kommentar dahinter.
# Zurücksetzen auf Herdr-Defaults: `herdr config reset-keys`

[keys]
prefix = "ctrl+b"                   # tmux: set -g prefix2 C-b (herdr kennt nur einen Prefix,
                                    # C-Space aus `set -g prefix` entfällt daher)

reload_config = "prefix+q"          # tmux: bind q source-file
detach = "prefix+d"                 # tmux default: prefix d

# Panes — tmux: bind v split-window -h (nebeneinander), bind b split-window -v (untereinander)
split_vertical = "prefix+v"
split_horizontal = "prefix+b"
close_pane = "prefix+x"             # tmux: bind x kill-pane
toggle_sidebar = "prefix+m"         # tmux: bind m set-option -g status

# Pane-Fokus — tmux: bind -n C-M-<arrow> select-pane
# ctrl+h/j/k/l laufen zusätzlich über den Navigator unten.
focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"
resize_mode = "prefix+ctrl+r"       # tmux: bind -r C-h/j/k/l resize-pane

# Tabs (= tmux windows)
new_tab = "prefix+c"                # tmux: bind c new-window
rename_tab = "prefix+r"             # tmux: bind r rename-window
close_tab = "prefix+shift+x"        # tmux: bind X kill-window
switch_tab = ["prefix+1..9", "alt+1..9"]  # tmux: prefix 1-9 (Default) + bind -n M-1..9 select-window
previous_tab = "alt+left"           # tmux: bind -n M-Left select-window -t -1
next_tab = "alt+right"              # tmux: bind -n M-Right select-window -t +1

# tmux: bind l last-window. herdr hat kein last_tab — last_pane springt zur
# zuletzt fokussierten Pane, auch über Tab- und Workspace-Grenzen hinweg.
last_pane = "prefix+l"

# Workspaces (= tmux sessions)
new_workspace = "prefix+shift+c"    # tmux: bind C new-session
rename_workspace = "prefix+shift+r" # tmux: bind R rename-session
close_workspace = "prefix+shift+k"  # tmux: bind K kill-session
previous_workspace = "alt+up"       # tmux: bind -n M-Up switch-client -p
next_workspace = "alt+down"         # tmux: bind -n M-Down switch-client -n

# vim-tmux-navigator: ctrl+h/j/k/l wechselt nahtlos zwischen nvim-Fenstern
# und herdr-Panes. Die Entscheidung trifft herdr-nav.sh.
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "/home/henning/.config/herdr/herdr-nav.sh left ctrl+h"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "/home/henning/.config/herdr/herdr-nav.sh down ctrl+j"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "/home/henning/.config/herdr/herdr-nav.sh up ctrl+k"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "/home/henning/.config/herdr/herdr-nav.sh right ctrl+l"

[ui]
agent_panel_sort = "spaces"

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

[theme]
name = "catppuccin"
auto_switch = false
