# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browser

bindd = SUPER, return, Terminal, exec, $terminal --dir=$(omarchy-cmd-terminal-cwd)

# screenshots mapped to SUPER + DELETE key
unbind = SUPER CTRL, Delete
bindd = SUPER, DELETE, Screenshot of region, exec, omarchy-capture-screenshot region
bindd = SUPER SHIFT, DELETE, Screenshot of window, exec, omarchy-capture-screenshot windows
bindd = SUPER CTRL, DELETE, Screenshot of display, exec, omarchy-capture-screenshot fullscreen

# Close window
bindd = SUPER SHIFT, Q, Close active window, killactive,

# Control tiling
bindd = SUPER SHIFT, F, Toggle floating, togglefloating,
bindd = SUPER, F, Maximize active window, fullscreen, 1

# Move focus with mainMod + arrow keys
bindd = SUPER, h, Move focus left, movefocus, l
bindd = SUPER, k, Move focus up, movefocus, u
bindd = SUPER, j, Move focus down, movefocus, d
bindd = SUPER, l, Move focus right, movefocus, r

# Swap active window with the one next to it with mainMod + SHIFT + arrow keys
bindd = SUPER SHIFT, h, Swap window to the left, swapwindow, l
bindd = SUPER SHIFT, j, Swap window up, swapwindow, u
bindd = SUPER SHIFT, k, Swap window down, swapwindow, d
bindd = SUPER SHIFT, l, Swap window to the right, swapwindow, r


bind = SUPER SHIFT, t, togglegroup
bind = SUPER SHIFT CTRL, RIGHT, changegroupactive, f
bind = SUPER SHIFT CTRL, LEFT, changegroupactive, b
